* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "ObvExt", sans-serif;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.card {
  position: relative;
  width: 460px;
  height: 820px;
  overflow: visible;
}
.bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background-image: url("hpet.png");
  background-size: cover;
  background-position: center center;
  z-index: 0;
}
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 6, 28, 0.65);
  z-index: 1;
}
.content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 820px;
  padding: 22px 22px 26px;
  gap: 0;
}

/* HEADER — logos más grandes */
.header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.35);
  border-radius: 9px;
  padding: 13px 16px;
  backdrop-filter: blur(4px);
  flex-shrink: 0;
}
.logo-dell { width: 100px; display: block; }
.logo-oneteam { height: 52px; width: auto; display: block; }

/* Spacer más chico arriba para subir el titular */
.spacer-top { flex: 0.4; }
.spacer-bot { flex: 0.4; }

.mid {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 26px;
  width: 100%;
}

/* 1. EL MUNDIAL IS COMING — subido y un poco más grande */
.headline {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  width: 100%;
}
.line-main {
  font-family: "ObvExt", sans-serif;
  font-weight: 600;
  font-size: 24px;
  color: #fff;
  text-transform: uppercase;
  line-height: 1.08;
  white-space: nowrap;
  max-width: 100%;
  overflow: visible;
}
.line-main span { color: #01A982; }

.countries {
  font-family: "Barlow", sans-serif;
  font-weight: 700;
  font-size: 8px;
  color: rgba(255,255,255,0.52);
  letter-spacing: 2.5px;
  text-transform: uppercase;
}

.counter-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.faltan-row {
  display: flex;
  align-items: center;
  gap: 7px;
}
.arrow { color: #01A982; font-size: 10px; font-weight: 900; }
.faltan-text {
  font-family: "Barlow", sans-serif;
  font-weight: 700;
  font-size: 8px;
  color: rgba(255,255,255,0.70);
  letter-spacing: 3px;
  text-transform: uppercase;
}
.countdown {
  display: flex;
  gap: 6px;
  width: 100%;
}
.unit {
  flex: 1;
  background: rgba(0,8,40,0.78);
  border: 1px solid rgba(1,169,130,0.45);
  border-top: 2.5px solid #01A982;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 3px 10px;
}
.num {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 900;
  font-size: 42px;
  color: #FFFFFF;
  line-height: 1;
  letter-spacing: -1px;
  transition: transform 0.1s ease, color 0.1s ease;
}

.num.tick {
  transform: scale(1.08);
  color: #FFFFFF;
}

.unit-label {
  font-family: "Barlow", sans-serif;
  font-weight: 700;
  font-size: 7px;
  color: #FFFFFF;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 3px;
}
.sep {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 900;
  font-size: 26px;
  color: rgba(255,255,255,0.5);
  align-self: center;
}

.quiniela {
  font-family: "ObvExt", sans-serif;
  font-weight: 600;
  font-size: 18px;
  color: #fff;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.2;
}
.quiniela span { color: #01A982; }

.tagline {
  font-family: "ObvExt", sans-serif;
  font-weight: 600;
  font-size: 13px;
  color: rgba(255,255,255,0.75);
  text-transform: uppercase;
  text-align: center;
  line-height: 1.3;
}
.tagline span { color: #01A982; }

.btn {
  display: block;
  width: 100%;
  background: #01A982;
  color: #00050f;
  font-family: "ObvExt", sans-serif;
  font-weight: 600;
  font-size: clamp(10px, 2.5vw, 12px);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 14px;
  border-radius: 8px;
  text-decoration: none;
  text-align: center;
  transition: background 0.15s, transform 0.1s;
  flex-shrink: 0;
}
.btn:hover { background: #fff; transform: scale(1.02); }
</style>
</head>

<script>
const target = new Date("2026-06-11T18:00:00-05:00");
function pad(n) { return String(Math.floor(n)).padStart(2,"0"); }
let prevSec = null;
function tick() {
  const diff = target - new Date();
  if (diff <= 0) { ["days","hours","minutes","seconds"].forEach(id => document.getElementById(id).textContent="00"); return; }
  const d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
  document.getElementById("days").textContent=pad(d);
  document.getElementById("hours").textContent=pad(h);
  document.getElementById("minutes").textContent=pad(m);
  const secEl=document.getElementById("seconds");
  if(s!==prevSec){ secEl.textContent=pad(s); secEl.classList.add("tick"); setTimeout(()=>secEl.classList.remove("tick"),120); prevSec=s; }
}
tick(); setInterval(tick,1000);
</script>
